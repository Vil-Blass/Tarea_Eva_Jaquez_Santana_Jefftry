<!-- SE REPRESENTA EL CANVAS SOLO CUANDO EXISTEN DATOS FILTRADOS. -->
@if (restaurantes().length === 0) {
    <ion-item lines="none" class="ion-text-center">
        <ion-label>
            <h2>No hay restaurantes disponibles</h2>
        </ion-label>
    </ion-item>
}@else {
    <div class="grafico-barra-vertical" role="img" aria-label="Gráfico de barras verticales de restaurantes por territorio">
        <canvas #canvasVertical class="canvasVertical" role="img" aria-label="Restaurantes por territorio"></canvas>
    </div>
}
