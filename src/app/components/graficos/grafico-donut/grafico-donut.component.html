<!-- SE REPRESENTA EL CANVAS SOLO CUANDO EXISTEN DATOS FILTRADOS. -->
@if (restaurantes().length === 0) {
    <ion-item lines="none" class="ion-text-center">
        <ion-label>
            <h2>No hay restaurantes disponibles</h2>
        </ion-label>
    </ion-item>
}@else {
    <div class="grafico-donut" role="img" aria-label="Gráfico de dona con las diez localidades principales">
        <canvas #canvasDonut class="canvasDonut" role="img" aria-label="Top diez localidades con más restaurantes"></canvas>
    </div>
}
