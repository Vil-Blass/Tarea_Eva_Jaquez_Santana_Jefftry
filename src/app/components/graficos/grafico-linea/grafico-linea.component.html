<!-- SE REPRESENTA EL CANVAS SOLO CUANDO EXISTEN DATOS FILTRADOS. -->
@if (restaurantes().length === 0) {
    <ion-item lines="none" class="ion-text-center">
        <ion-label>
            <h2>No hay restaurantes disponibles</h2>
        </ion-label>
    </ion-item>
}@else {
    <div class="grafico-linea" role="img" aria-label="Gráfico de líneas de distinciones gastronómicas por territorio">
        <canvas #canvasLinea class="canvasLinea" role="img" aria-label="Estrellas Michelin y soles Repsol por territorio"></canvas>
    </div>
}
